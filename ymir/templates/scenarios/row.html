<!-- Scenario Row -->
<tr class="scenario-row hover:bg-slate-800/30 transition-colors"
    id="row-{{ scenario.id }}">

    <!-- Checkbox -->
    <td class="p-4" _="on click halt">
        <input type="checkbox" class="row-checkbox w-4 h-4 rounded border-slate-600 bg-slate-800 text-ymir-500"
            value="{{ scenario.id }}">
    </td>

    <!-- Name / Description -->
    <td class="p-4">
        <div class="max-w-[400px]">
            <div class="font-medium text-sm text-slate-200 mb-1">
                {{ scenario.name }}
            </div>
            <p class="text-xs text-slate-500 line-clamp-2">
                {{ scenario.description }}
            </p>
        </div>
    </td>

    <!-- Category -->
    <td class="p-4">
        {% if scenario.category %}
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold uppercase tracking-wide
            {% if scenario.category == 'healthcare' %}bg-blue-500/10 text-blue-500 border border-blue-500/20
            {% elif scenario.category == 'finance' %}bg-green-500/10 text-green-500 border border-green-500/20
            {% elif scenario.category == 'retail' %}bg-purple-500/10 text-purple-500 border border-purple-500/20
            {% elif scenario.category == 'education' %}bg-orange-500/10 text-orange-500 border border-orange-500/20
            {% else %}bg-slate-500/10 text-slate-500 border border-slate-500/20{% endif %}">
            {{ scenario.category }}
        </span>
        {% else %}
        <span class="text-slate-600 text-xs">--</span>
        {% endif %}
    </td>

    <!-- Tool Count -->
    <td class="p-4 text-center">
        <span class="inline-flex items-center justify-center gap-1.5 px-3 py-1.5 bg-slate-800 rounded-lg text-sm font-bold text-slate-300">
            <i data-lucide="wrench" class="w-3.5 h-3.5 text-slate-500"></i>
            {{ scenario.tool_count or 0 }}
        </span>
    </td>

    <!-- Actions -->
    <td class="p-4">
        <div class="flex items-center justify-center gap-2">
            <!-- Edit -->
            <button class="p-2 rounded-lg text-slate-400 hover:text-ymir-500 hover:bg-slate-800 transition-colors"
                title="Edit Scenario"
                hx-get="/scenarios/form/{{ scenario.id }}"
                hx-target="#modal-container"
                hx-swap="innerHTML"
                _="on click halt">
                <i data-lucide="pencil" class="w-4 h-4"></i>
            </button>

            <!-- Manage Tools -->
            <button class="p-2 rounded-lg text-slate-400 hover:text-blue-500 hover:bg-slate-800 transition-colors"
                title="Manage Tools"
                hx-get="/scenarios/{{ scenario.id }}/tools"
                hx-target="#modal-container"
                hx-swap="innerHTML"
                _="on click halt">
                <i data-lucide="wrench" class="w-4 h-4"></i>
            </button>

            <!-- Delete -->
            <button class="p-2 rounded-lg text-slate-400 hover:text-red-500 hover:bg-slate-800 transition-colors"
                title="Delete Scenario"
                hx-delete="/scenarios/{{ scenario.id }}"
                hx-confirm="Are you sure you want to delete this scenario? This action cannot be undone."
                hx-target="closest tr"
                hx-swap="outerHTML swap:300ms"
                _="on click halt">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
        </div>
    </td>
</tr>
